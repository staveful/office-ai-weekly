<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>办公 AI 小报</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17233d;
      --muted: #64708a;
      --blue: #2b68f6;
      --cyan: #15b8d6;
      --line: rgba(43, 104, 246, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(21, 184, 214, 0.18), transparent 32%),
        radial-gradient(circle at 88% 18%, rgba(89, 77, 255, 0.18), transparent 34%),
        #f7f9ff;
    }
    main {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: 92px 0 72px;
    }
    .eyebrow {
      margin: 0 0 14px;
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 72px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }
    .intro {
      max-width: 620px;
      margin: 22px 0 48px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
    }
    .issue-card {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 6vw, 52px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 24px 70px rgba(45, 79, 150, 0.12);
      backdrop-filter: blur(12px);
    }
    .issue-card::after {
      content: "AI";
      position: absolute;
      right: -8px;
      bottom: -52px;
      color: rgba(43, 104, 246, 0.055);
      font-size: 190px;
      font-weight: 800;
      line-height: 1;
      pointer-events: none;
    }
    .label {
      display: inline-flex;
      padding: 7px 12px;
      border-radius: 999px;
      color: #1953d7;
      background: #eaf0ff;
      font-size: 14px;
      font-weight: 700;
    }
    h2 {
      position: relative;
      z-index: 1;
      margin: 22px 0 10px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.25;
    }
    .date {
      margin: 0 0 30px;
      color: var(--muted);
    }
    .button {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      box-shadow: 0 12px 28px rgba(43, 104, 246, 0.24);
      font-weight: 700;
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(43, 104, 246, 0.3);
    }
    .button span { font-size: 20px; }
    .archive {
      margin-top: 32px;
      padding: 28px 30px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.68);
    }
    .archive h3 {
      margin: 0 0 16px;
      font-size: 18px;
    }
    .archive-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: var(--ink);
      font-weight: 650;
      text-decoration: none;
    }
    .archive-link small {
      color: var(--muted);
      font-weight: 500;
    }
    .archive-link:hover { color: var(--blue); }
    footer {
      margin-top: 34px;
      color: #8993a8;
      font-size: 13px;
    }
    @media (max-width: 600px) {
      main { padding-top: 56px; }
      .intro { margin-bottom: 32px; font-size: 16px; }
      .issue-card { border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Office AI Weekly</p>
    <h1>办公 AI 小报</h1>
    <p class="intro">每周整理 AI 在办公场景中的使用情况与实践发现。</p>

    <section class="issue-card" aria-labelledby="latest-title">
      <span class="label">最新一期</span>
      <h2 id="latest-title">M8W1 穗彩 AI 办公小报</h2>
      <p class="date">2026 年 8 月 · 第 1 周</p>
      <a class="button" href="issues/M8W1/M8W1%E7%A9%97%E5%BD%A9AI%E5%8A%9E%E5%85%AC%E5%B0%8F%E6%8A%A5.html">
        查看最新一期 <span aria-hidden="true">→</span>
      </a>
    </section>

    <section class="archive" aria-labelledby="archive-title">
      <h3 id="archive-title">往期小报</h3>
      <a class="archive-link" href="issues/M7W4/M7W4%E7%A9%97%E5%BD%A9AI%E5%8A%9E%E5%85%AC%E5%B0%8F%E6%8A%A5.html">
        <span>M7W4 穗彩 AI 办公小报</span>
        <small>2026 年 7 月 · 第 4 周 →</small>
      </a>
    </section>

    <footer>后续每一期小报都会在这里持续更新。</footer>
  </main>
</body>
</html>
